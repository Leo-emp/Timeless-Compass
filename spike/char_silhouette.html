<!doctype html>
<!--
  CHARACTER TEST: CINEMATIC SILHOUETTE close-up.
  King Leonidas in a Corinthian helmet, backlit by a giant sun. No face detail at all:
  the helmet, crest, beard and spear carry the character. The eye slit lets the sun through.
-->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Cinzel:wght@600;800&display=block" rel="stylesheet">
<style>html,body{margin:0;width:1080px;height:1920px;background:#000;overflow:hidden}svg{display:block}</style>
</head><body>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="common.js"></script>
<script>
const R = rng(480);
const INK = '#0b0604';

// ---------- the figure's shapes (facing left) ----------
// helmet + beard + neck + shoulders as ONE outline
const BODY = `M 760 1060 C 800 950, 805 770, 720 650 C 660 575, 530 555, 450 610 C 405 645, 388 700, 392 745
  L 372 762 L 376 905 C 377 922, 392 930, 408 926 L 418 922 C 414 970, 412 1015, 424 1052 L 478 1072
  C 456 1110, 446 1150, 458 1190 L 446 1200 L 470 1206 L 460 1224 L 490 1220
  C 530 1205, 565 1170, 585 1125 L 600 1250 C 560 1300, 470 1340, 390 1410 C 320 1470, 290 1620, 280 1920
  L 1080 1920 L 1080 1460 C 990 1380, 870 1310, 810 1220 C 785 1170, 768 1110, 760 1060 Z`;
// the tall horsehair crest on top of the helmet
const CREST_OUT = [[455, 610], [450, 420], [720, 360], [880, 560]];
const CREST = `M 455 610 C 450 420, 720 360, 880 560 C 930 630, 940 720, 905 800 C 890 720, 850 640, 780 600
  C 700 560, 560 560, 470 640 Z`;
// the spear held upright in front
const SPEAR = `M 236 1920 L 244 590 L 258 590 L 266 1920 Z M 251 600 C 270 560, 266 500, 251 440 C 236 500, 232 560, 251 600 Z`;
// the arm + fist gripping the spear
const ARM = capsule([360, 1540], 46, [262, 1660], 40, INK);

add(`<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1a0606"/><stop offset=".28" stop-color="#5a120a"/><stop offset=".5" stop-color="#c0360e"/>
    <stop offset=".68" stop-color="#f07a1a"/><stop offset="1" stop-color="#ffc060"/>
  </linearGradient>
  <radialGradient id="sun"><stop offset="0" stop-color="#fffbe8"/><stop offset=".5" stop-color="#ffe0a0"/><stop offset=".85" stop-color="#ffa848"/><stop offset="1" stop-color="#ff7a20"/></radialGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#ffb050" stop-opacity=".95"/><stop offset=".45" stop-color="#ff6a20" stop-opacity=".35"/><stop offset="1" stop-color="#ff3a10" stop-opacity="0"/></radialGradient>
  <linearGradient id="titleFire" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0d0"/><stop offset=".5" stop-color="#ffb040"/><stop offset="1" stop-color="#d0400c"/></linearGradient>
  <!-- eye slit: a hole cut in the helmet so the sun shines through -->
  <mask id="eyeHole" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1920">
    <rect width="1080" height="1920" fill="#fff"/>
    <path d="M 394 752 C 412 739, 446 739, 472 750 C 450 765, 414 768, 394 760 Z" fill="#000"/>
  </mask>
  <clipPath id="figClip"><path d="${BODY}"/><path d="${CREST}"/></clipPath>
  <filter id="glow" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1480" height="2320"><feGaussianBlur in="SourceGraphic" stdDeviation="12" result="a"/><feMerge><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>`);

// ---------- sky + sun right behind the head ----------
add(`<rect width="${W}" height="${H}" fill="url(#sky)"/>`);
add(`<circle cx="540" cy="880" r="860" fill="url(#halo)"/>`);
add(`<circle cx="560" cy="870" r="410" fill="url(#sun)"/>`);
for (let i = 0; i < 7; i++) { const y = 700 + i * 80 + R() * 30;
  add(`<ellipse cx="${200 + R() * 700}" cy="${y}" rx="${260 + R() * 300}" ry="${4 + R() * 7}" fill="#8a2208" opacity="${.12 + R() * .14}" ${blur(4)}/>`); }

// ---------- distant arrows falling from the top ----------
let arrows = '';
for (let i = 0; i < 220; i++) {
  const x = R() * 1300 - 100, y = 120 + R() * 520, len = 22 + R() * 16, ang = 2.55 + R() * 0.18;
  const x2 = x + Math.cos(ang) * len, y2 = y + Math.sin(ang) * len;
  arrows += `<line x1="${x}" y1="${y}" x2="${x2}" y2="${y2}" stroke="${INK}" stroke-width="${1 + R()}" opacity="${.35 + R() * .45}"/>`;
}
add(arrows);

// ---------- far ridge with the rest of the 300 (tiny spears) ----------
add(`<path d="M0 1580 C 200 1530, 500 1525, 1080 1560 L1080 1920 L0 1920 Z" fill="${INK}"/>`);
for (let i = 0; i < 40; i++) { const x = 10 + i * 8 + R() * 4;
  add(`<line x1="${x}" y1="${1556 - i * .3}" x2="${x + 3}" y2="${1490 - R() * 20}" stroke="${INK}" stroke-width="2"/>`); }

// ---------- rim light: the sun bleeding around the edges ----------
const rim = (sw, b, col, op) => `<g fill="none" stroke="${col}" stroke-width="${sw}" opacity="${op}" ${blur(b)}>
  <path d="${BODY}"/><path d="${CREST}"/><path d="${SPEAR}"/></g>`;
add(rim(22, 14, '#ffb050', .8));
add(rim(6, 2, '#fff0c8', .9));

// ---------- the silhouette itself ----------
add(`<g mask="url(#eyeHole)" fill="${INK}">
  <path d="${BODY}"/><path d="${CREST}"/>
</g>`);
// horsehair bristles along the top of the crest
let bristle = '';
for (let i = 0; i <= 120; i++) {
  const t = i / 120, p = bez(...CREST_OUT, t), q = bez(...CREST_OUT, Math.min(1, t + .01));
  const nx = (q[1] - p[1]), ny = -(q[0] - p[0]), L = Math.hypot(nx, ny) || 1, len = 6 + R() * 16;
  bristle += `<line x1="${p[0]}" y1="${p[1]}" x2="${p[0] + nx / L * len}" y2="${p[1] + ny / L * len}" stroke="${INK}" stroke-width="${1.5 + R() * 1.5}"/>`;
}
add(bristle);
// a faint warm inner edge so the helmet feels like metal, not a cut-out
add(`<g clip-path="url(#figClip)" fill="none" stroke="#ff8a30" stroke-width="18" opacity=".35" ${blur(8)}><path d="${BODY}"/></g>`);
// the eye slit glows
add(`<path d="M 394 752 C 412 739, 446 739, 472 750 C 450 765, 414 768, 394 760 Z" fill="#ffd890" opacity=".35" ${blur(6)}/>`);
// spear + gripping arm in front
add(`<path d="${SPEAR}" fill="${INK}"/>`);
add(ARM);

// ---------- embers + dust ----------
for (let i = 0; i < 80; i++) add(`<circle cx="${R() * W}" cy="${600 + R() * 1200}" r="${.8 + R() * 2.4}" fill="#ffc070" opacity="${.2 + R() * .6}"/>`);

// ---------- title ----------
add(`<g text-anchor="middle">
  <text x="540" y="170" font-family="Cinzel, serif" font-weight="600" font-size="32" letter-spacing="14" fill="#ffd8b0">LEONIDAS · KING OF SPARTA</text>
  <text x="540" y="280" font-family="Anton, Impact" font-size="96" letter-spacing="3" fill="#fff0dc">THE KING WHO</text>
  <text x="540" y="390" font-family="Anton, Impact" font-size="112" letter-spacing="3" fill="url(#titleFire)" filter="url(#glow)">NEVER RETREATED</text>
</g>`);
finish({ grain: .2, vignette: .75 });
</script></body></html>
