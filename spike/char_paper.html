<!doctype html>
<!--
  CHARACTER TEST: PAPER-CUT close-up.
  Odysseus with a torch on the night Troy fell. Same head kit, flipped to face right.
  Every part is a separate cut-paper layer with its own shadow; the eye is a cut-out.
-->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Cinzel:wght@600;800&display=block" rel="stylesheet">
<style>html,body{margin:0;width:1080px;height:1920px;background:#000;overflow:hidden}svg{display:block}</style>
</head><body>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="common.js"></script>
<script>
const R = rng(1184);
// the conical felt cap (pilos) Odysseus is always shown wearing
const CAP = `M 466 805 C 455 700, 540 560, 700 540 C 800 545, 860 650, 862 780 C 863 820, 855 860, 840 880 C 720 860, 580 830, 466 805 Z`;

add(`<defs>
  <filter id="paper" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#000510" flood-opacity=".7"/></filter>
  <filter id="paperSm" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000510" flood-opacity=".6"/></filter>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070d22"/><stop offset=".55" stop-color="#16244e"/><stop offset="1" stop-color="#5a2a3a"/></linearGradient>
  <radialGradient id="fireGlow" cx="50%" cy="100%" r="70%"><stop offset="0" stop-color="#ff8a30" stop-opacity=".85"/><stop offset="1" stop-color="#ff4a10" stop-opacity="0"/></radialGradient>
  <radialGradient id="torchGlow"><stop offset="0" stop-color="#ffc060" stop-opacity=".75"/><stop offset=".5" stop-color="#ff7a20" stop-opacity=".25"/><stop offset="1" stop-color="#ff5010" stop-opacity="0"/></radialGradient>
  <clipPath id="faceClip"><path d="${HEAD.face}"/></clipPath>
</defs>`);

// ---------- layer 0: night sky + stars + the glow of the burning city ----------
add(`<rect width="${W}" height="${H}" fill="url(#sky)"/>`);
for (let i = 0; i < 140; i++) add(`<circle cx="${R() * W}" cy="${R() * 1000}" r="${R() > .93 ? 2.4 : .8 + R() * 1.2}" fill="#fff6dc" opacity="${.4 + R() * .6}"/>`);
add(`<rect y="700" width="${W}" height="900" fill="url(#fireGlow)"/>`);

// ---------- layer 1: flames rising behind the walls (paper tongues) ----------
function flame(x, y, h, w, col) { return `<path d="M ${x - w} ${y} C ${x - w} ${y - h * .5}, ${x - w * .2} ${y - h * .6}, ${x} ${y - h}
  C ${x + w * .3} ${y - h * .6}, ${x + w} ${y - h * .45}, ${x + w} ${y} Z" fill="${col}" filter="url(#paperSm)"/>`; }
for (let i = 0; i < 14; i++) { const x = 40 + i * 78 + R() * 30, h = 200 + R() * 260;
  add(flame(x, 1300, h, 50 + R() * 30, '#c8401a')); add(flame(x + 6, 1300, h * .65, 30 + R() * 14, '#f08a2a')); add(flame(x + 4, 1300, h * .35, 16, '#ffd060')); }

// ---------- layer 2: Troy's walls and towers in dark paper, lit windows ----------
let wall = `<path d="M0 1240 L 1080 1240 L 1080 1500 L 0 1500 Z`;
for (let i = 0; i < 6; i++) { const x = 30 + i * 190; wall += ` M ${x} 1240 L ${x} 1120 L ${x + 90} 1120 L ${x + 90} 1240 Z`; }
add(wall + `" fill="#1a2348" filter="url(#paper)"/>`);
for (let i = 0; i < 6; i++) { const x = 30 + i * 190;
  for (let k = 0; k < 4; k++) add(`<rect x="${x + 6 + k * 22}" y="1104" width="14" height="18" fill="#1a2348"/>`);
  add(`<rect x="${x + 36}" y="1160" width="16" height="26" rx="8" fill="#ffb040"/>`); }

// ---------- layer 3: Odysseus (head kit flipped to face right) ----------
let g = '';
g += `<path d="${HEAD.face}" fill="#e6be92" filter="url(#paper)"/>`;
// clothes go on top of the neck so it disappears into the collar
g += `<path d="${HEAD.tunic}" fill="#c8a878" filter="url(#paper)"/>`;
g += `<path d="${HEAD.cloak}" fill="#2e4f86" filter="url(#paper)"/>`;
g += `<path d="M 640 1440 C 700 1500, 730 1620, 740 1770" stroke="#1e3866" stroke-width="10" fill="none"/>`;
// torchlight warms the front of the face; the back sits in a darker paper layer
g += `<g clip-path="url(#faceClip)"><circle cx="360" cy="960" r="220" fill="#ffa050" opacity=".45"/>
  <path d="${HEAD.shade}" fill="#b88660" filter="url(#paperSm)"/></g>`;
g += `<path d="${HEAD.ear}" fill="#c99a70" filter="url(#paperSm)"/>`;
g += `<path d="${HEAD.hair}" fill="#3a2416" filter="url(#paper)"/>`;
g += `<path d="${CAP}" fill="#a8482a" filter="url(#paper)"/>`;
g += `<path d="M 466 805 C 580 830, 720 860, 840 880 L 844 852 C 720 834, 580 806, 470 780 Z" fill="#d8743e" filter="url(#paperSm)"/>`; // cap brim strip
g += `<path d="${HEAD.beard}" fill="#4a2e1e" filter="url(#paper)"/>`;
// a few cut lines in the beard (paper scored with a knife)
for (let i = 0; i < 5; i++) g += `<path d="M ${450 + i * 40} ${1110 + i * 8} C ${455 + i * 40} ${1160 + i * 6}, ${445 + i * 38} ${1210}, ${455 + i * 34} ${1260 - i * 10}" stroke="#2a180e" stroke-width="5" fill="none"/>`;
g += `<path d="${HEAD.eye}" fill="#1a1008"/>`;                              // the eye is a cut-out
g += `<path d="${HEAD.brow}" stroke="#3a2416" stroke-width="10" fill="none" stroke-linecap="round"/>`;
g += `<path d="${HEAD.mouth}" stroke="#2a180e" stroke-width="5" fill="none" stroke-linecap="round"/>`;
add(`<g transform="translate(1112 -150) scale(-1.2 1.2)">${g}</g>`);

// ---------- layer 4: the torch arm in front ----------
add(`<circle cx="870" cy="690" r="330" fill="url(#torchGlow)" style="mix-blend-mode:screen"/>`);
add(`<g filter="url(#paper)">${capsule([610, 1640], 70, [780, 1150], 52, '#2e4f86')}</g>`);         // sleeve
add(`<g filter="url(#paper)">${capsule([780, 1150], 40, [832, 960], 32, '#e6be92')}</g>`);           // forearm
add(`<line x1="806" y1="1090" x2="870" y2="740" stroke="#6a3e22" stroke-width="22" stroke-linecap="round" filter="url(#paper)"/>`); // torch stick
add(`<ellipse cx="836" cy="950" rx="44" ry="40" fill="#e6be92" filter="url(#paper)"/>`);            // fist
add(`<rect x="840" y="720" width="56" height="34" rx="8" fill="#4a2a16" transform="rotate(10 868 737)" filter="url(#paperSm)"/>`); // pitch wrap
add(flame(872, 730, 260, 70, '#e0461a')); add(flame(874, 730, 180, 46, '#f8922a')); add(flame(872, 730, 100, 24, '#ffe070'));
for (let i = 0; i < 30; i++) add(`<circle cx="${820 + R() * 140}" cy="${380 + R() * 320}" r="${1.5 + R() * 3}" fill="#ffc060" opacity="${.3 + R() * .6}"/>`);

// ---------- title ----------
add(`<g text-anchor="middle">
  <text x="540" y="170" font-family="Cinzel, serif" font-weight="600" font-size="32" letter-spacing="14" fill="#f4e4c4">ODYSSEUS · THE LAST NIGHT</text>
  <text x="540" y="285" font-family="Anton, Impact" font-size="100" letter-spacing="3" fill="#fff4e0">THE MIND BEHIND</text>
  <text x="540" y="400" font-family="Anton, Impact" font-size="116" letter-spacing="3" fill="#e8432c">THE HORSE</text>
</g>`);
finish({ grain: .18, vignette: .7 });
</script></body></html>
