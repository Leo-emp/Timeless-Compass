<!doctype html>
<!--
  Timeless Compass — background proof: one script line -> one rich drawn set.
  Line: "At dawn, Leonidas and his Spartans held the narrow pass — mountain on one side, sea on the other,
         and the whole Persian army camped beyond."
  Every layer is its own <g> so the camera can move them at different speeds later (depth/parallax):
    sky -> far mountains -> sea + fleet -> plain + Persian camp -> cliff -> wall + phalanx -> heroes -> foreground rocks
  Drawn 100% in code. No images, no AI.
-->
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}svg{display:block}</style></head>
<body>
<svg id="scene" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="cast_lib.js"></script>
<script src="cast_lib2.js"></script>
<script>
// seeded random so the same scene draws identically every frame (needed for animation later)
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const R = rng(480);
// background outline helper: thinner than character outlines so heroes stay the focus
const bg = (d, fill, w=4)=> `<path d="${d}" fill="${fill}" stroke="${OUT}" stroke-width="${w}" stroke-linejoin="round"/>`;

// ---------- 1. sky at dawn ----------
let sky = `<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9a77a"/><stop offset=".55" stop-color="#f6cf98"/><stop offset="1" stop-color="#fde9c4"/></linearGradient>
  <radialGradient id="sunGlow"><stop offset="0" stop-color="#fff6d8" stop-opacity="1"/><stop offset="1" stop-color="#fff6d8" stop-opacity="0"/></radialGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fb3c4"/><stop offset="1" stop-color="#3f7f9a"/></linearGradient>
</defs>`;
sky += `<rect width="1920" height="1080" fill="url(#sky)"/>`;
sky += `<circle cx="1480" cy="380" r="260" fill="url(#sunGlow)"/><circle cx="1480" cy="390" r="62" fill="#fff3cf" stroke="#f2c27a" stroke-width="4"/>`;
// flat cartoon clouds with outline
function cloud(x,y,s){ return `<g transform="translate(${x} ${y}) scale(${s})">${bg('M0 40 Q-10 10 26 8 Q36 -16 70 -6 Q96 -26 124 0 Q160 0 156 40 Z','#fbeedd',4)}${`<path d="M20 34 Q70 26 140 34" stroke="#e8c9a8" stroke-width="5" fill="none"/>`}</g>`; }
sky += cloud(820,120,1.2)+cloud(1220,200,.9)+cloud(1700,190,.8)+cloud(1020,290,.6);
// birds
for (let i=0;i<6;i++){ const x=1100+R()*500, y=160+R()*160; sky += `<path d="M${x-10} ${y} q5 -6 10 0 q5 -6 10 0" stroke="${OUT}" stroke-width="3" fill="none" stroke-linecap="round"/>`; }

// ---------- 2. far mountains across the gulf ----------
let far = bg('M700 440 L820 380 L900 400 L1010 340 L1110 390 L1200 360 L1330 410 L1460 372 L1580 420 L1700 380 L1820 410 L1920 390 L1920 450 L700 450 Z','#b9a3bf',3);
far += bg('M900 450 L1000 410 L1120 430 L1260 400 L1400 436 L1560 412 L1720 440 L1920 424 L1920 456 L900 456 Z','#a48fb0',3);

// ---------- 3. the sea (Malian Gulf) + Persian fleet ----------
let sea = bg('M720 446 L1920 446 L1920 1080 L1400 1080 Q1180 830 1010 650 Q880 520 720 446 Z','url(#sea)',4);
for (let i=0;i<70;i++){ const x=880+R()*1040, y=470+R()*560; if (x < 760 + (y-446)*0.95) continue; const w=10+R()*22; sea += `<path d="M${x} ${y} q${w/2} -5 ${w} 0" stroke="#d6eef2" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8"/>`; }
sea += `<path d="M1460 452 L1500 600 L1530 452 Z" fill="#fff3cf" opacity=".25"/>`;                       // sun glitter on the water
// tiny triremes: hull + sail, many of them = the Persian fleet
for (let i=0;i<26;i++){ const x=1120+R()*760, y=462+R()*60, s=.5+((y-462)/60)*.5;
  sea += `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-22 0 L22 0 L16 7 L-18 7 Z" fill="#5a3a2a" stroke="${OUT}" stroke-width="2"/><path d="M0 0 L0 -22" stroke="${OUT}" stroke-width="2"/><path d="M1 -20 L14 -12 L1 -4 Z" fill="#e8dcc0" stroke="${OUT}" stroke-width="1.5"/></g>`; }

// ---------- 4. the plain beyond the pass + the Persian camp ----------
let plain = bg('M560 440 L760 446 Q880 520 1010 650 Q1180 830 1400 1080 L380 1080 Q420 900 520 760 Q570 620 560 440 Z','#c9b07a',4);
plain += `<path d="M600 450 Q760 470 860 540 L820 548 Q720 490 590 470 Z" fill="#b59a62"/>`;                       // distant green-brown fields
// the road through the pass, getting narrower into the distance
plain += bg('M640 1080 Q760 820 790 660 Q800 560 780 470 L800 470 Q840 560 880 660 Q930 820 1060 1080 Z','#e2cb98',3);
// Persian camp: rows of tents with banners, tiny figures, cook-fire smoke
let camp = '';
for (let i=0;i<46;i++){ const x=600+R()*260, y=452+R()*40, s=.55+((y-452)/40)*.45; const col=['#e9e0c8','#d9c39a','#c25b3a','#e2d6b4'][i%4];
  camp += `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-12 0 L0 -16 L12 0 Z" fill="${col}" stroke="${OUT}" stroke-width="2" stroke-linejoin="round"/><path d="M0 -16 L0 -24" stroke="${OUT}" stroke-width="1.5"/></g>`; }
for (let i=0;i<60;i++){ const x=610+R()*250, y=470+R()*30; camp += `<circle cx="${x}" cy="${y-5}" r="2" fill="#2a1c13"/><rect x="${x-1.6}" y="${y-3}" width="3.2" height="5" fill="${['#7a3a6a','#3a5a8a','#a67a2a'][i%3]}"/>`; }
for (let i=0;i<5;i++){ const x=630+i*50+R()*20; camp += `<path d="M${x} 470 Q${x-14} 430 ${x+6} 400 Q${x+24} 370 ${x+4} 330" stroke="#9c8f86" stroke-width="${10+R()*6}" fill="none" stroke-linecap="round" opacity=".45"/>`; }
for (let i=0;i<4;i++){ const x=650+i*60; camp += `<path d="M${x} 452 L${x} 424" stroke="${OUT}" stroke-width="2"/><path d="M${x} 424 L${x+16} 429 L${x} 434 Z" fill="#b8862a" stroke="${OUT}" stroke-width="1.5"/>`; }

// ---------- 5. Mount Kallidromos: the cliff wall on the left ----------
let cliff = bg('M0 0 L430 0 Q560 50 640 130 Q720 220 690 320 Q650 440 620 520 Q590 650 520 760 Q430 900 390 1080 L0 1080 Z','#9a7756',5);
cliff += `<path d="M430 0 Q560 50 640 130 Q720 220 690 320 Q650 440 620 520 Q590 650 520 760 Q430 900 390 1080 L300 1080 Q360 880 450 740 Q520 620 540 500 Q580 380 600 300 Q620 190 520 90 Q460 30 360 0 Z" fill="#b8916a"/>`;   // lit face catching the dawn
// rock strata and cracks
for (let i=0;i<18;i++){ const y=60+i*56, x=120+R()*380; cliff += `<path d="M${x-80} ${y} q40 -10 80 4 q30 8 60 -2" stroke="#6e5238" stroke-width="4" fill="none" stroke-linecap="round"/>`; }
for (let i=0;i<10;i++){ const x=80+R()*420, y=120+R()*860; cliff += `<path d="M${x} ${y} l8 22 l-6 18 l10 26" stroke="#5e442e" stroke-width="3" fill="none" stroke-linecap="round"/>`; }
// pines clinging to the cliff top and ledges
function pine(x,y,s){ return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-4" y="-6" width="8" height="22" fill="#5a3a24" stroke="${OUT}" stroke-width="3"/>${bg('M0 -70 L26 -24 L12 -26 L32 6 L-32 6 L-12 -26 L-26 -24 Z','#4f6b3a',4)}<path d="M2 -60 L20 -26 L10 -26 L26 2" fill="none" stroke="#3b5229" stroke-width="3"/></g>`; }
[[470,40,1],[540,80,.9],[610,140,.8],[380,30,1.1],[300,60,1],[200,50,1.15],[640,300,.6],[600,470,.55]].forEach(([x,y,s])=> cliff += pine(x,y,s));

// ---------- 6. the Phocian wall across the pass + the phalanx ----------
let wall = '';
const wallY = 650;
for (let row=0; row<3; row++) for (let i=0;i<16;i++){
  const x = 560 + i*28 + (row%2)*14, y = wallY - row*16;
  if (x > 1000 - row*4) continue;
  wall += `<rect x="${x}" y="${y}" width="${24+R()*6}" height="15" rx="4" fill="${['#c9b89a','#b8a688','#d6c6a6'][Math.floor(R()*3)]}" stroke="${OUT}" stroke-width="2.5"/>`;
}
// a line of small Spartans in front of the wall, shields locked
let phalanx = '';
for (let i=0;i<13;i++){ const x=590 + i*31; phalanx += `<g transform="translate(${x} ${wallY+52}) scale(.22)">${spartanWall()}</g>`; }

// ---------- 7. heroes in the foreground ----------
let heroes = '';
heroes += `<g transform="translate(760 1044) scale(.8)">${leonidas()}</g>`;
heroes += `<g transform="translate(1150 1054) scale(.72)">${spartanAttack()}</g>`;

// ---------- 8. foreground rocks + grass (frames the shot, adds depth) ----------
let fore = '';
fore += bg('M0 980 Q60 930 160 950 Q230 920 300 960 Q340 1000 330 1080 L0 1080 Z','#7c5f45',5)+`<path d="M30 980 Q120 960 200 980" stroke="#5e442e" stroke-width="4" fill="none"/>`;
fore += bg('M1500 1080 Q1520 1010 1600 1000 Q1680 960 1760 990 Q1880 980 1920 1010 L1920 1080 Z','#8a6a4c',5);
function tuft(x,y,s){ return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-14 0 Q-12 -20 -18 -30 M-4 0 Q-2 -26 -6 -40 M6 0 Q8 -22 14 -34 M14 0 Q18 -14 26 -20" stroke="#5f7a3a" stroke-width="5" fill="none" stroke-linecap="round"/></g>`; }
[[360,1070,1],[520,1072,.8],[900,1076,.9],[1320,1074,1],[1460,1068,.8],[1800,1000,.9],[240,960,.8]].forEach(([x,y,s])=> fore += tuft(x,y,s));
for (let i=0;i<14;i++){ const x=380+R()*1100, y=900+R()*170; plain += `<ellipse cx="${x}" cy="${y}" rx="${6+R()*10}" ry="${4+R()*5}" fill="#a88e62" stroke="${OUT}" stroke-width="2.5"/>`; }


// foam where the waves meet the shore
sea += `<path d="M720 446 Q880 520 1010 650 Q1180 830 1400 1080" stroke="#f4fbfb" stroke-width="10" fill="none" stroke-dasharray="40 18" stroke-linecap="round" opacity=".9"/>`;
[[1080,760,1],[1210,900,1.3],[1330,1010,.9],[960,600,.7]].forEach(([x,y,k])=> sea += `<g transform="translate(${x} ${y}) scale(${k})">${bg('M-30 10 Q-26 -14 0 -18 Q26 -16 32 10 Z','#8a7a66',4)}<path d="M-40 12 Q0 4 42 12" stroke="#f4fbfb" stroke-width="5" fill="none" stroke-linecap="round"/></g>`);
// a Persian warship closer in: hull, oars, sail with a sun emblem
sea += `<g transform="translate(1600 660) scale(2.6)">
  <path d="M-48 0 L44 0 Q52 -4 56 -12 L52 6 Q20 14 -40 12 Q-50 8 -48 0 Z" fill="#5a3a2a" stroke="${OUT}" stroke-width="2.5" stroke-linejoin="round"/>
  ${Array.from({length:9},(_,i)=>`<path d="M${-36+i*9} 8 l-4 12" stroke="${OUT}" stroke-width="1.6"/>`).join('')}
  <path d="M0 0 L0 -46" stroke="${OUT}" stroke-width="2.5"/>
  <path d="M-24 -42 L24 -42 L20 -8 L-20 -8 Z" fill="#efe2c4" stroke="${OUT}" stroke-width="2.2" stroke-linejoin="round"/>
  <circle cx="0" cy="-25" r="7" fill="#c9862a" stroke="${OUT}" stroke-width="1.6"/>
  <path d="M-60 16 Q0 10 60 16" stroke="#f4fbfb" stroke-width="2.5" fill="none" stroke-linecap="round"/></g>`;
// cliff: boulders piled at the base, shadow band where the rock meets the road
cliff += `<path d="M520 760 Q430 900 390 1080 L360 1080 Q400 900 500 750 Z" fill="#6e5238" opacity=".55"/>`;
[[520,800,1.2],[470,900,1],[580,700,.8],[430,1000,1.3],[610,620,.7]].forEach(([x,y,k])=> cliff += `<g transform="translate(${x} ${y}) scale(${k})">${bg('M-34 14 Q-40 -16 -8 -24 Q30 -28 36 6 Q30 20 -34 14 Z','#a5825f',4)}<path d="M-20 -10 Q0 -18 18 -8" stroke="#c9a47c" stroke-width="4" fill="none" stroke-linecap="round"/></g>`);
// road ruts + grassy verges along the coast side
plain += `<path d="M760 1080 Q830 820 805 600 M940 1080 Q870 820 830 600" stroke="#c9ad74" stroke-width="5" fill="none" stroke-linecap="round"/>`;
for (let i=0;i<18;i++){ const t=R(), y=560+t*500, x=880+ (y-560)*0.55 + R()*60; plain += tuft(x,y,.45+t*.6); }
function shrub(x,y,k){ return `<g transform="translate(${x} ${y}) scale(${k})">${bg('M-30 0 Q-36 -26 -12 -30 Q-4 -46 14 -36 Q36 -36 32 -10 Q38 0 30 0 Z','#6f8a44',4)}<path d="M-14 -16 Q0 -24 16 -16" stroke="#8ea85a" stroke-width="4" fill="none" stroke-linecap="round"/></g>`; }
[[1000,760,.8],[1080,880,1],[1250,1050,1.2],[930,680,.6]].forEach(([x,y,k])=> plain += shrub(x,y,k));

// ---------- 9. the one allowed card: place + date ----------
let card = `<g transform="translate(1440 60)"><rect x="0" y="0" width="430" height="62" rx="8" fill="#f4e6c6" stroke="${OUT}" stroke-width="4"/><text x="215" y="41" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="700" fill="${OUT}">THERMOPYLAE · 480 BC</text></g>`;

// each layer in its own group, ready for parallax camera moves
document.getElementById('scene').innerHTML =
  `<g id="L_sky">${sky}</g><g id="L_far">${far}</g><g id="L_sea">${sea}</g><g id="L_plain">${plain}${camp}</g>`+
  `<g id="L_cliff">${cliff}</g><g id="L_wall">${wall}${phalanx}</g><g id="L_heroes">${heroes}</g><g id="L_fore">${fore}</g>${card}`;
</script>
</body></html>
