<!doctype html>
<!--
  Timeless Compass — motion test: the Greek fleet under way (8 s).
  window.draw(t) rebuilds the whole picture for time t (seconds). The renderer (anim.js) calls it per frame.
  Motion (only what the line needs):
    camera   slow push-in + drift; near layers move more than far ones (depth / parallax)
    ship     bobs and rocks on the swell
    oars     row in a ripple from bow to stern; blades lift out of the water on the return stroke
    sail     breathes in the wind
    sea      wave marks slide past the hull; sun glitter shimmers
    others   far ships bob; gulls flap; the commander blinks
  Drawn 100% in code. No images, no AI.
-->
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}svg{display:block}</style></head>
<body>
<svg id="scene" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="cast_lib.js"></script>
<script src="cast_lib2.js"></script>
<script>
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let x=Math.imul(seed^seed>>>15,1|seed); x=x+Math.imul(x^x>>>7,61|x)^x; return ((x^x>>>14)>>>0)/4294967296; }; }
const bg = (d, fill, w=4)=> `<path d="${d}" fill="${fill}" stroke="${OUT}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;
const T = 8;                                        // clip length (s)
const ease = x => x<.5 ? 2*x*x : 1-Math.pow(-2*x+2,2)/2;   // smooth start + stop for the camera
const wrap = (v, w) => ((v % w) + w) % w;

const DEFS_FLEET = `<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fb4d6"/><stop offset=".6" stop-color="#cfe2e6"/><stop offset="1" stop-color="#f8e3b8"/></linearGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fa6bd"/><stop offset=".5" stop-color="#2f7d9e"/><stop offset="1" stop-color="#1f5f80"/></linearGradient>
  <radialGradient id="sunGlow"><stop offset="0" stop-color="#fff8dc" stop-opacity="1"/><stop offset="1" stop-color="#fff8dc" stop-opacity="0"/></radialGradient>
</defs>`;
function cloud(x,y,s){ return `<g transform="translate(${x} ${y}) scale(${s})">${bg('M0 40 Q-14 8 26 6 Q34 -22 72 -10 Q100 -34 132 -4 Q172 -6 166 40 Z','#fdf7ec',4)}<path d="M22 34 Q80 24 150 34" stroke="#d9e4e6" stroke-width="5" fill="none"/></g>`; }

function deckSpartan(skin, helmetUp){
  let s = hopliteBody(skin, true);
  s += pole(-60,-500,-60,-20)+sh('path',{d:'M-60 -548 L-70 -500 L-50 -500 Z'},'#cfcfcf');
  s += limb('M-44 -222 Q-60 -214 -60 -200',20,skin)+hand(-60,-196,skin);
  s += helmetUp ? head(skin,'stern',{beard:'#2a1d14'})+hair.corinthian() : head(skin,'stern')+corinthClosed('fan');
  return s;
}

// trireme at time t. detail = near ship with crew. ph = phase offset so ships don't move in lockstep.
function trireme(t, detail, sailCol='#efe2c4', ph=0){
  let s='';
  const b = 10*Math.sin(t*1.4+ph);                       // sail breathing
  s += `<path d="M480 8 Q700 30 1000 20 M460 16 Q700 50 980 54" stroke="#e6f6f8" stroke-width="10" fill="none" stroke-linecap="round" opacity="${.7+.15*Math.sin(t*3+ph)}"/>`;
  s += `<path d="M10 -120 L10 -640" stroke="${OUT}" stroke-width="18" stroke-linecap="round"/><path d="M10 -120 L10 -640" stroke="#7a5230" stroke-width="9" stroke-linecap="round"/>`;
  s += bg('M-250 -600 L270 -600 L270 -588 L-250 -588 Z','#6a4428',4);
  s += bg(`M-236 -590 Q10 ${-560+b} 256 -590 Q${290+b} -440 250 -300 Q10 ${-330+b} -230 -300 Q${-268-b} -440 -236 -590 Z`,sailCol,5);
  s += `<path d="M-150 -580 Q${-170-b/2} -440 -150 -310 M-60 -574 Q-74 -440 -60 -320 M80 -574 Q92 -440 80 -320 M170 -580 Q${190+b/2} -440 170 -310" stroke="#cdbf9c" stroke-width="4" fill="none"/>`;
  s += ln(`M-50 -360 L10 ${-520+b/2} L70 -360`,22,'#a8322a');
  if (detail) s += `<path d="M10 -640 L-470 -150 M10 -640 L470 -170" stroke="${OUT}" stroke-width="3" fill="none"/>`;
  if (detail) for (let i=0;i<11;i++){ const x=-330+i*64, sway=2*Math.sin(t*1.6+i*.7); s += `<g transform="translate(${x} ${-40+sway}) scale(.42)">${deckSpartan(['#d8a87c','#dcae84','#cf9e72'][i%3], i===0)}</g>`; }
  s += bg('M-470 -6 L-470 -42 Q-486 -112 -440 -128 L400 -128 Q478 -142 506 -210 Q524 -262 494 -304 Q540 -280 540 -210 Q538 -120 450 -40 Q300 4 -400 4 Z','#5b3a26',6);
  s += `<path d="M-466 -104 L420 -104 Q470 -110 500 -150" stroke="#b5452c" stroke-width="16" fill="none"/><path d="M-462 -80 L430 -80" stroke="#d8b36a" stroke-width="5" fill="none"/>`;
  s += `<path d="M-470 -42 L-470 -6 L-400 4 L300 4 Q380 -4 450 -40 Z" fill="rgba(0,0,0,.22)"/>`;
  for (let x=-400;x<=400;x+=32) s += `<circle cx="${x}" cy="-56" r="6" fill="#2a1c13"/>`;
  s += bg('M-470 -14 L-572 -26 L-470 -40 Z','#c99a45',4);
  s += bg('M-454 -96 Q-432 -112 -408 -96 Q-432 -82 -454 -96 Z','#f4efe2',3)+`<circle cx="-431" cy="-96" r="7" fill="${OUT}"/>`;
  // oars: one rowing cycle ~1.25 s; a small delay per oar makes the ripple run bow -> stern
  let i=0;
  for (let x=-390;x<=390;x+=32, i++){
    const p = t*2*Math.PI*0.8 + ph - i*0.12;
    const bx = x - 70 + 34*Math.sin(p);                  // sweep fore and aft
    const lift = Math.max(0, Math.cos(p));               // return stroke: blade out of the water
    const by = 46 - 30*lift;
    s += `<path d="M${x} -56 L${bx} ${by}" stroke="${OUT}" stroke-width="8" stroke-linecap="round"/><path d="M${x} -56 L${bx} ${by}" stroke="#c49a62" stroke-width="3.5" stroke-linecap="round"/>`;
    if (lift < .15) s += `<ellipse cx="${bx-2}" cy="48" rx="${12+8*(1-lift)}" ry="5" fill="#e6f6f8" opacity=".9"/>`;   // splash only while the blade is in
  }
  s += `<path d="M-580 -4 Q-520 ${-30-4*Math.sin(t*3+ph)} -470 -10 Q-520 10 -600 14" stroke="#f2fbfc" stroke-width="10" fill="none" stroke-linecap="round"/>`;
  if (detail){
    for (let k=0;k<14;k++) s += aspis(-390+k*58,-150,30);
    s += `<path d="M470 -150 L560 40" stroke="${OUT}" stroke-width="14" stroke-linecap="round"/><path d="M470 -150 L560 40" stroke="#8b5a2b" stroke-width="7" stroke-linecap="round"/>`;
    s += `<g transform="translate(450 -120) scale(.4)">${sh('path',{d:'M-46 -238 Q0 -248 46 -238 L50 -120 L-50 -120 Z'},'#e9dcc0')}${limb('M44 -222 Q90 -120 100 30',18,'#d8a87c')}${limb('M-44 -222 Q40 -120 90 6',18,'#d8a87c')}${hand(100,30,'#d8a87c')}${hand(90,6,'#d8a87c')}${head('#d8a87c','neutral',{beard:'#3a2a1e'})}${sh('path',{d:'M-62 -296 Q-70 -372 0 -374 Q70 -372 62 -296 Q56 -330 30 -338 Q0 -330 -30 -338 Q-56 -330 -62 -296 Z'},'#3a2a1e')}</g>`;
    s += `<g transform="translate(-412 -118) scale(.5)">${leonidas()}</g>`;
  } else {
    for (let k=0;k<12;k++) s += `<circle cx="${-380+k*68}" cy="-140" r="22" fill="#b23a2a" stroke="${OUT}" stroke-width="5"/>`;
  }
  return s;
}

// camera: zoom about the frame centre + sideways drift, scaled by each layer's depth (0 = infinitely far, 1 = hero)
function cam(t, depth, content){
  const k = ease(Math.min(1, t/T));
  const z = 1 + 0.07*k*depth, dx = -26*k*depth, dy = -10*k*depth;
  return `<g transform="translate(${960+dx} ${560+dy}) scale(${z}) translate(-960 -560)">${content}</g>`;
}

window.draw = function(t){
  const R = rng(1805);                                   // same random layout every frame
  window.BLINK = false;
  // sky + sun (depth .05)
  let sky = DEFS_FLEET + `<rect x="-200" y="-200" width="2320" height="1480" fill="url(#sky)"/>`;
  sky += `<circle cx="330" cy="300" r="${300+6*Math.sin(t*1.1)}" fill="url(#sunGlow)"/><circle cx="330" cy="300" r="58" fill="#fff6d6" stroke="#f0cf86" stroke-width="4"/>`;
  sky += cloud(700+t*3,90,1.5)+cloud(1180+t*2,160,1.1)+cloud(1580+t*3,180,.9)+cloud(980+t*1.5,300,.7)+cloud(1700+t*2,300,.8);
  // islands (depth .15)
  let isl = bg('M-100 470 L90 420 L170 440 L260 390 L360 430 L460 410 L560 460 L560 480 L-100 480 Z','#8fa3a0',3);
  isl += bg('M1240 476 Q1320 420 1420 430 Q1500 400 1580 440 Q1660 430 1720 476 Z','#9aaeab',3);
  isl += `<path d="M300 420 l0 -18 l6 0 l0 18 M296 402 l14 0" stroke="${OUT}" stroke-width="2" fill="#e8e0cc"/>`;
  for (let i=0;i<5;i++) isl += `<rect x="${290+i*5}" y="404" width="2" height="16" fill="${OUT}"/>`;
  // sea (depth .5): wave marks slide right (the ship moves left through them)
  let sea = `<rect x="-200" y="476" width="2320" height="800" fill="url(#sea)"/><path d="M-200 476 L2120 476" stroke="${OUT}" stroke-width="3"/>`;
  sea += `<path d="M270 478 L400 478 L470 1180 L180 1180 Z" fill="#fff6d6" opacity="${.14+.05*Math.sin(t*2.3)}"/>`;
  for (let i=0;i<170;i++){ const y0=490+Math.pow(R(),1.4)*600, x0=R()*2200, k=.4+(y0-476)/600*1.6, w=12*k+R()*14*k;
    const x = wrap(x0 + t*30*k, 2300) - 200, y = y0 + 3*k*Math.sin(t*2+x0);
    sea += `<path d="M${x} ${y} q${w/2} ${-5*k} ${w} 0" stroke="#d8f0f4" stroke-width="${2+k*1.6}" fill="none" stroke-linecap="round" opacity="${.55+.25*Math.sin(t*3+i)}"/>`; }
  // far fleet (depth .4): each ship bobs on its own rhythm and creeps forward
  let fleet = '';
  [[1500,520,.16],[1260,540,.2],[1000,566,.25],[720,600,.32],[1700,560,.22],[1480,610,.3]].sort((a,b)=>a[1]-b[1]).forEach(([x,y,k],i)=>{
    const ph=i*1.7, bob=4*k*Math.sin(t*1.5+ph)*4, rot=0.8*Math.sin(t*1.2+ph);
    fleet += `<g transform="translate(${x - t*10*k*4} ${y+bob}) rotate(${rot}) scale(${k})">${trireme(t, false, i%2?'#efe2c4':'#e8d0a8', ph)}</g>`; });
  // hero ship (depth 1): bob + gentle rock; the commander blinks twice
  const bob = 7*Math.sin(t*1.5), rock = 0.7*Math.sin(t*1.2+.6);
  window.BLINK = (t>2.4 && t<2.56) || (t>6.1 && t<6.26);
  const hero = `<g transform="translate(980 ${960+bob}) rotate(${rock}) scale(1.02)">${trireme(t, true)}</g>`;
  window.BLINK = false;
  // gulls + front spray (depth 1.2)
  let fore = '';
  [[260,640,1.4],[420,700,1],[1760,720,1.2],[1600,640,.8]].forEach(([x,y,k],i)=>{
    const f = 10*Math.sin(t*7+i*2), gx = x + t*(14+i*4), gy = y + 6*Math.sin(t*1.3+i);
    fore += `<g transform="translate(${gx} ${gy}) scale(${k})"><path d="M-26 ${-f*.3} Q-14 ${-14-f} 0 0 Q14 ${-14-f} 26 ${-f*.3}" stroke="${OUT}" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M-24 ${-f*.3} Q-14 ${-11-f} -2 -1 M2 -1 Q14 ${-11-f} 24 ${-f*.3}" stroke="#fafafa" stroke-width="2.5" fill="none" stroke-linecap="round"/></g>`; });
  for (let i=0;i<30;i++){ const x=wrap(R()*2200 + t*60, 2300)-200, y=1000+R()*80; fore += `<path d="M${x} ${y} q14 -8 28 0" stroke="#e6f6f8" stroke-width="5" fill="none" stroke-linecap="round"/>`; }
  // place + date card: fixed to the screen (not the camera), fades in over the first second
  const card = `<g transform="translate(1440 50)" opacity="${Math.min(1, t/1)}"><rect width="430" height="62" rx="8" fill="#f4e6c6" stroke="${OUT}" stroke-width="4"/><text x="215" y="41" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="700" fill="${OUT}">THE GREEK FLEET · 480 BC</text></g>`;
  document.getElementById('scene').innerHTML =
    cam(t,.05,sky)+cam(t,.15,isl)+cam(t,.5,sea)+cam(t,.4,fleet)+cam(t,1,hero)+cam(t,1.2,fore)+card;
};
window.draw(0);
</script>
</body></html>
