# Cloud render TEST (Plan 3, M3 step 1): render one library still on a free GitHub runner (CPU) and keep it
# as a downloadable artifact. Run by hand from the Actions tab ("Run workflow"). No secrets needed.
name: render-test
on:
  workflow_dispatch:
    inputs:
      scene:
        description: "scene script in blender/scenes/"
        default: "salamis_set_test.py"
      samples:
        description: "Cycles samples"
        default: "32"
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender + MakeHuman (free, CC0)
        run: echo "BLENDER=$(bash cloud/setup_blender_linux.sh $HOME/tools | tail -1)" >> "$GITHUB_ENV"
      - name: Render
        run: |
          mkdir -p out
          "$BLENDER" -b --python "blender/scenes/${{ inputs.scene }}" -- "$PWD/out/render.png" "${{ inputs.samples }}" 2>&1 | grep -E "saved|Error|Traceback" || true
          test -f out/render.png
      - uses: actions/upload-artifact@v4
        with:
          name: render-${{ github.run_id }}
          path: out/render.png
