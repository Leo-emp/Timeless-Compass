# RENDER MANY TEST SCENES IN PARALLEL (free GitHub runners, 1 per request, up to 20 at once).
# Trigger: push a change to cloud/batch.json (lists request names in cloud/requests/). Each runner installs Blender 5.3
# + MPFB, downloads the free CC0 Poly Haven scans (cloud/scans_polyhaven.json), renders its request and uploads the
# images as an artifact named render-<request>. No secrets used; Sketchfab/Mixamo assets are skipped in the cloud.
name: render-batch
on:
  push:
    branches: [cinematic-agent]
    paths: [cloud/batch.json]
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.m.outputs.names }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          b = json.load(open('cloud/batch.json'))
          print("names=" + json.dumps(b["run"][:20]))
          PY
  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        name: ${{ fromJson(needs.plan.outputs.names) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Libraries Blender needs
        run: |
          pip install -q numpy pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 ffmpeg > /dev/null
      - name: Cache Blender + MPFB
        uses: actions/cache@v4
        with:
          path: ~/tools
          key: blender-5.3.0-mpfb-${{ hashFiles('cloud/setup_blender_linux.sh') }}
      - name: Install Blender 5.3 + MPFB (free, CC0)
        run: echo "BLENDER=$(bash cloud/setup_blender_linux.sh $HOME/tools | tail -1)" >> "$GITHUB_ENV"
      - name: Cache the CC0 scans
        uses: actions/cache@v4
        with:
          path: library/scans
          key: scans-${{ hashFiles('cloud/scans_polyhaven.json') }}
      - name: Download the free scans (Poly Haven CC0)
        run: |
          python3 - <<'PY'
          import json, subprocess
          for kind, ids in json.load(open('cloud/scans_polyhaven.json')).items():
              subprocess.run(['python', '-m', 'tc', 'assets', 'fetch', *ids, '--kind', kind], check=False)
          PY
      - name: Render ${{ matrix.name }}
        env:
          REQ: ${{ matrix.name }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          r = json.load(open(f"cloud/requests/{os.environ['REQ']}.json"))
          os.makedirs('out', exist_ok=True)
          cmd = [os.environ['BLENDER'], '-b', '--python', r['script'], '--'] + r['args']
          print(' '.join(cmd), flush=True)
          sys.exit(subprocess.run(cmd).returncode)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-${{ matrix.name }}
          path: out/
          retention-days: 14
