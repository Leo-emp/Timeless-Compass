name: Documentary Pipeline

on:
  schedule:
    # Mon/Wed/Fri 07:00 UTC
    - cron: '0 7 * * 1,3,5'
  workflow_dispatch:
    # Manual trigger from GitHub UI or dashboard
    inputs:
      topic:
        description: 'Historical topic — leave empty for AI to pick'
        required: false
        default: ''
      format:
        description: 'Video format'
        required: false
        default: 'long'
        type: choice
        options:
          - long
          - mid
          - short
      quality:
        description: 'Output quality'
        required: false
        default: '1080p'
        type: choice
        options:
          - 1080p
          - 4k

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          PIPELINE_TOPIC: ${{ github.event.inputs.topic }}
          PIPELINE_FORMAT: ${{ github.event.inputs.format || 'long' }}
          PIPELINE_QUALITY: ${{ github.event.inputs.quality || '1080p' }}
        run: |
          if [ -n "$PIPELINE_TOPIC" ]; then
            python main.py "$PIPELINE_TOPIC" --format "$PIPELINE_FORMAT" --quality "$PIPELINE_QUALITY"
          else
            python main.py --format "$PIPELINE_FORMAT" --quality "$PIPELINE_QUALITY"
          fi
