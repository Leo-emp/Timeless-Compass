# CLOUD RENDER QUEUE (replaces the shared cloud/batch.json): each session submits its own request file
#   python -m tc queue submit <name> <scene script> [args...] --session <letter>   -> cloud/queue/<id>.json
# and pushes it. This workflow renders EXACTLY the queue files that push added (1 free CPU runner each, up to 20),
# so sessions never overwrite or re-render each other's work. Re-render by hand: Actions -> render-queue ->
# Run workflow -> ids (comma separated). Each artifact is named render-<id> and holds out/ (images + _results/<id>.json).
# No secrets. Sketchfab scans are skipped unless the repo variable TC_R2_PUBLIC_URL (public asset cache) is set.
name: render-queue
on:
  push:
    branches: [cinematic-agent]
    paths: ["cloud/queue/*.json"]
  workflow_dispatch:
    inputs:
      ids:
        description: "queue ids to render (comma separated, without .json)"
        required: true
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.m.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0               # need history to see which files this push added
      - id: m
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          IDS: ${{ inputs.ids }}       # env vars, never pasted into the script (injection-safe)
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, subprocess
          from tc.cloud_queue import changed_entries
          if os.environ.get("IDS"):
              ids = [i.strip() for i in os.environ["IDS"].split(",") if i.strip()]
          else:
              before = os.environ["BEFORE"]
              if not before or set(before) == {"0"}:        # first push of the branch: compare with the parent
                  before = os.environ["AFTER"] + "~1"
              files = subprocess.run(["git", "diff", "--name-only", "--diff-filter=A", before, os.environ["AFTER"]],
                                     capture_output=True, text=True, check=True).stdout.split()
              ids = changed_entries(files)
          # only GitHub-target requests that exist; Kaggle-target ones go through `tc queue kaggle`
          keep = []
          for i in ids:
              p = f"cloud/queue/{i}.json"
              if re.fullmatch(r"[0-9a-z-]+", i) and os.path.exists(p) and json.load(open(p)).get("target", "github") == "github":
                  keep.append(i)
          print("ids=" + json.dumps(keep[:20]))
          PY

  render:
    needs: plan
    if: needs.plan.outputs.ids != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false                 # one failed request must not cancel the others
      max-parallel: 20
      matrix:
        id: ${{ fromJson(needs.plan.outputs.ids) }}
    env:
      TC_R2_PUBLIC_URL: ${{ vars.TC_R2_PUBLIC_URL }}
      TC_SCANS_CAP_GB: "12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages + libraries Blender needs
        run: |
          pip install -q numpy pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 ffmpeg > /dev/null
      - name: Cache Blender + MPFB
        uses: actions/cache@v4
        with:
          path: ~/tools
          key: blender-5.3.0-mpfb-${{ hashFiles('cloud/setup_blender_linux.sh') }}
      - name: Install Blender 5.3 + MPFB (free, CC0)
        run: echo "BLENDER=$(bash cloud/setup_blender_linux.sh $HOME/tools | tail -1)" >> "$GITHUB_ENV"
      - name: Render ${{ matrix.id }} (scans -> Blender -> image checks -> finish)
        env:
          ID: ${{ matrix.id }}
        run: python -m tc queue run "cloud/queue/$ID.json" --blender "$BLENDER"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-${{ matrix.id }}
          path: out/
          retention-days: 14
          if-no-files-found: ignore
